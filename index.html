<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA manifest -->
    <link rel="manifest" href="/tvfreak/manifest.json" />

    <!-- Standard favicon -->
    <link rel="icon" type="image/svg+xml" href="/tvfreak/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/tvfreak/icon-192.png" />

    <!-- iOS home screen icon & standalone mode -->
    <link rel="apple-touch-icon" href="/tvfreak/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TVFREAK" />

    <!-- Android / Chrome theme -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0D0D0D" />

    <title>TVFREAK</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <script type="module" crossorigin src="/tvfreak/assets/index-CB06KUrf.js"></script>
    <link rel="stylesheet" crossorigin href="/tvfreak/assets/index-COxtu0Sb.css">
  </head>
  <body>
    <script>
      (function(){
        var s=localStorage.getItem('tvfreak-sab');
        if(s){document.documentElement.style.setProperty('--sab',s);}
        else if(navigator.standalone){
          // All home-indicator iPhones (X and newer) are >=812px — safe area is always 34px portrait.
          // Older iPhones (SE, 8) are <=736px and have a home button so safe area is 0.
          var h=Math.max(screen.width,screen.height);
          if(h>=812)document.documentElement.style.setProperty('--sab','34px');
        }
      })();
    </script>
    <div id="root"></div>
  </body>
</html>
