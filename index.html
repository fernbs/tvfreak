<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA manifest -->
    <link rel="manifest" href="%BASE_URL%manifest.json" />

    <!-- Standard favicon -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%icon-192.png" />

    <!-- iOS home screen icon & standalone mode -->
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TVFREAK" />

    <!-- Android / Chrome theme -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0D0D0D" />

    <title>TVFREAK</title>

    <!-- Set --app-h from window.innerHeight before React loads.
         100dvh lies on iOS Safari browser when the bottom toolbar is visible:
         it uses the large viewport, but window.innerHeight reflects the actual
         visual viewport. We update on every resize so orientation changes work. -->
    <script>
      (function () {
        function setH() {
          document.documentElement.style.setProperty('--app-h', window.innerHeight + 'px');
        }
        setH();
        window.addEventListener('resize', setH);
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
